name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4          # the browser tests run the page in jsdom
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - name: Install aLex and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm ci --prefix tests/js
      - name: Run the tests
        run: pytest
